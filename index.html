<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy</title>
<meta name="description" content="Tap to flap, thread the pipes, and chase the top score in Flappy for Usion.">
<meta name="theme-color" content="#071650">
<meta name="application-name" content="Flappy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="1024x1024" href="/icons/flappy-icon-1024.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/flappy-icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" as="image" type="image/webp" href="/game-assets/background.webp">
<link rel="preload" as="image" type="image/png" href="/game-assets/bird-mid.png">
<link rel="preload" as="image" type="image/png" href="/game-assets/pipe-cap.png">
<link rel="preload" as="image" type="image/png" href="/game-assets/pipe-body.png">
<meta property="og:type" content="website">

<meta property="og:title" content="Flappy">
<meta property="og:description" content="Tap to flap, thread the pipes, and chase the top score.">

<meta name="twitter:image" content="https://usion-flappy.vercel.app/icons/flappy-icon-1024.png">
<script src="https://usions.com/usion-sdk.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #000000; --muted: #666666; --line: #e5e5e5;
    --panel: #ffffff; --accent: #0070f3;
  }
  .dark {
    --bg: #000000; --fg: #ffffff; --muted: #999999; --line: #222222;
    --panel: #0a0a0a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    opacity: 1; transition: opacity 160ms ease;
  }
  .overlay.hidden { display: none; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .hint { font-size: 15px; color: var(--muted); text-align: center; }
  #start {
    color: #ffffff;
    background: linear-gradient(180deg, rgba(1, 7, 31, 0.06), rgba(2, 16, 67, 0.2));
    text-shadow: 0 2px 10px rgba(0, 18, 70, 0.72);
  }
  #start .hint { color: rgba(255, 255, 255, 0.82); }
  .panel {
    width: min(340px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    animation: rise 220ms cubic-bezier(0.21, 1.02, 0.73, 1);
  }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .score-row { display: flex; justify-content: space-around; text-align: center; }
  .score-row .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-row .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
  #new-best {
    display: none; text-align: center; font-size: 13px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.4px;
  }
  #new-best.show { display: block; animation: rise 260ms ease; }
  .btn {
    appearance: none; border: none; cursor: pointer; width: 100%;
    background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600;
    padding: 14px; border-radius: 10px; min-height: 48px;
  }
  .btn:active { opacity: 0.8; }
  .records { display: flex; flex-direction: column; max-height: 30vh; overflow-y: auto; }
  .seg {
    display: flex; gap: 4px; margin-bottom: 8px; padding: 3px; border-radius: 10px;
    background: color-mix(in srgb, var(--fg) 6%, transparent);
  }
  .seg-btn {
    flex: 1; appearance: none; border: none; cursor: pointer; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; padding: 7px 4px;
    border-radius: 8px; min-height: 34px;
  }
  .seg-btn.active { background: var(--panel); color: var(--fg); }
  .rec {
    display: flex; align-items: center; gap: 10px; padding: 8px 2px;
    border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .rec:last-child { border-bottom: none; }
  .rec .rank { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rec img, .rec .ph {
    width: 28px; height: 28px; border-radius: 50%; background: var(--line);
    flex-shrink: 0; object-fit: cover; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: var(--muted);
  }
  .rec .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec.me .nm { font-weight: 700; }
  .rec.me .rank { color: var(--accent); }
  .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 10px 0; }
  #hud {
    position: absolute; top: max(18px, env(safe-area-inset-top)); left: 0; right: 0;
    color: #ffffff; text-align: center; font-size: 44px; font-weight: 700;
    pointer-events: none; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0, 12, 55, 0.88), 0 1px 0 #001343;
    transition: transform 120ms ease; will-change: transform;
  }
  #hud.pop { transform: scale(1.18); }
  #hud.hidden { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .panel, #hud { animation: none; transition: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">0</div>

<div id="start" class="overlay">
  <h1 id="t-title">Flappy</h1>
  <p class="hint" id="t-tap">Tap to flap. Don't hit the pipes.</p>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <div class="score-row">
      <div><div class="num" id="final-score">0</div><div class="lbl" id="t-score">Score</div></div>
      <div><div class="num" id="best-score">0</div><div class="lbl" id="t-best">Best</div></div>
    </div>
    <div id="new-best">New record!</div>
    <div>
      <div class="seg" role="tablist">
        <button class="seg-btn active" id="tab-friends" role="tab" aria-selected="true">Friends</button>
        <button class="seg-btn" id="tab-global" role="tab" aria-selected="false">Global</button>
      </div>
      <div class="records" id="records"><div class="empty" id="t-loading">Loading…</div></div>
    </div>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- i18n ----------
  var STR = {
    en: { title: 'Flappy', tap: "Tap to flap. Don't hit the pipes.", score: 'Score', best: 'Best',
          friends: 'Friends', global: 'Global', loading: 'Loading…', again: 'Play again',
          empty: 'No friend records yet — invite friends and beat their scores!',
          emptyGlobal: 'No scores yet — be the first on the board!', you: 'You',
          newBest: 'New record!' },
    mn: { title: 'Flappy', tap: 'Товшиж нис. Хоолойд бүү мөргө.', score: 'Оноо', best: 'Дээд',
          friends: 'Найзууд', global: 'Дэлхий', loading: 'Уншиж байна…', again: 'Дахин тоглох',
          empty: 'Найзын амжилт алга — найзаа урьж, амжилтыг нь давaарай!',
          emptyGlobal: 'Оноо алга — тэргүүн нь болоорой!', you: 'Та',
          newBest: 'Шинэ дээд амжилт!' }
  };
  var L = STR.en;

  function applyStrings() {
    document.getElementById('t-title').textContent = L.title;
    document.getElementById('t-tap').textContent = L.tap;
    document.getElementById('t-score').textContent = L.score;
    document.getElementById('t-best').textContent = L.best;
    document.getElementById('tab-friends').textContent = L.friends;
    document.getElementById('tab-global').textContent = L.global;
    document.getElementById('again').textContent = L.again;
    document.getElementById('new-best').textContent = L.newBest;
  }

  // ---------- canvas (opaque + desynchronized for smoother compositing) ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }) ||
            canvas.getContext('2d');
  var reducedMotion = !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var lowPowerMode = reducedMotion ||
    (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
    (navigator.deviceMemory && navigator.deviceMemory <= 4);
  var dprCap = lowPowerMode ? 1 : 1.5;
  var sceneCanvas = document.createElement('canvas');
  var sceneCtx = sceneCanvas.getContext('2d', { alpha: false });
  var pipeBodyCanvas, pipeLipCanvas, birdSprites;
  var sceneImage = new Image();
  var birdImages = [new Image(), new Image(), new Image()];
  var pipeCapImage = new Image();
  var pipeBodyImage = new Image();
  var loadedAssetCount = 0;
  var totalAssetCount = 6;
  var W = 0, H = 0, DPR = 1;
  function imageReady(image) {
    return image.complete && image.naturalWidth > 0;
  }
  function loadGameAsset(image, source, rebuildBackground) {
    image.onload = function () {
      loadedAssetCount++;
      document.documentElement.dataset.gameAssets =
        loadedAssetCount === totalAssetCount ? 'ready' : 'loading';
      if (rebuildBackground) buildScene();
    };
    image.onerror = function () {
      document.documentElement.dataset.gameAssets = 'fallback';
    };
    image.src = source;
  }
  document.documentElement.dataset.gameAssets = 'loading';
  loadGameAsset(sceneImage, '/game-assets/background.webp', true);
  loadGameAsset(birdImages[0], '/game-assets/bird-up.png', false);
  loadGameAsset(birdImages[1], '/game-assets/bird-mid.png', false);
  loadGameAsset(birdImages[2], '/game-assets/bird-down.png', false);
  loadGameAsset(pipeCapImage, '/game-assets/pipe-cap.png', false);
  loadGameAsset(pipeBodyImage, '/game-assets/pipe-body.png', false);
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, dprCap);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();
  }
  function enableLowPowerMode() {
    if (lowPowerMode) return;
    lowPowerMode = true;
    dprCap = 1;
    resize();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- theme ----------
  var dark = false;
  var COL = { bg: '#ffffff', fg: '#000000', line: '#e5e5e5', soft: '#f2f2f2' };
  function applyTheme(t) {
    dark = t === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    document.body.classList.toggle('dark', dark);
    COL = dark
      ? { bg: '#000000', fg: '#ffffff', line: '#2a2a2a', soft: '#141414' }
      : { bg: '#ffffff', fg: '#000000', line: '#e5e5e5', soft: '#f2f2f2' };
  }

  // ---------- tuning ----------
  var GRAVITY = 1900, FLAP = -560;
  var BASE_SPEED = 160, MAX_SPEED = 235;     // px/s, ramps with score
  var PIPE_W = 68, LIP = 14;
  var PIPE_SPACING = 250;                    // px between pipe centers (distance-based)
  var FIXED_DT = 1 / 60;                     // stable physics without 120 Hz CPU cost
  var MAX_CATCH_UP_STEPS = 6;                // remains fair down to roughly 10 FPS

  // ---------- cached icon-style artwork ----------
  // The background and sprites are rendered once, then reused with drawImage.
  // This keeps the glossy icon look without rebuilding gradients every frame.
  function buildScene() {
    var sw = Math.max(1, Math.round(W));
    var sh = Math.max(1, Math.round(H));
    sceneCanvas.width = sw; sceneCanvas.height = sh;

    var sky = sceneCtx.createLinearGradient(0, 0, 0, sh);
    sky.addColorStop(0, '#020721');
    sky.addColorStop(0.5, '#061858');
    sky.addColorStop(1, '#087be8');
    sceneCtx.fillStyle = sky;
    sceneCtx.fillRect(0, 0, sw, sh);

    var glowRadius = Math.max(sw, sh) * 0.65;
    var glow = sceneCtx.createRadialGradient(sw * 0.5, sh * 0.9, 0,
                                             sw * 0.5, sh * 0.9, glowRadius);
    glow.addColorStop(0, 'rgba(120, 235, 255, 0.92)');
    glow.addColorStop(0.12, 'rgba(20, 151, 255, 0.5)');
    glow.addColorStop(0.55, 'rgba(4, 35, 126, 0.18)');
    glow.addColorStop(1, 'rgba(2, 7, 33, 0)');
    sceneCtx.fillStyle = glow;
    sceneCtx.fillRect(0, 0, sw, sh);

    var starCount = lowPowerMode ? 18 : 34;
    for (var i = 0; i < starCount; i++) {
      var sx = (((i * 73 + 19) % 101) / 101) * sw;
      var sy = (((i * 47 + 11) % 89) / 89) * sh * 0.72;
      var sr = i % 7 === 0 ? 1.7 : 0.8;
      sceneCtx.fillStyle = i % 5 === 0
        ? 'rgba(255, 190, 55, 0.9)' : 'rgba(90, 215, 255, 0.78)';
      sceneCtx.beginPath();
      sceneCtx.arc(sx, sy, sr, 0, Math.PI * 2);
      sceneCtx.fill();
    }

    function cloud(x, y, scale, alpha) {
      sceneCtx.fillStyle = 'rgba(45, 117, 238, ' + alpha + ')';
      sceneCtx.beginPath();
      sceneCtx.arc(x, y, 28 * scale, Math.PI, Math.PI * 2);
      sceneCtx.arc(x + 28 * scale, y - 12 * scale, 36 * scale, Math.PI, Math.PI * 2);
      sceneCtx.arc(x + 66 * scale, y, 30 * scale, Math.PI, Math.PI * 2);
      sceneCtx.lineTo(x + 96 * scale, y + 22 * scale);
      sceneCtx.lineTo(x, y + 22 * scale);
      sceneCtx.closePath();
      sceneCtx.fill();
    }
    cloud(-20, sh * 0.87, Math.max(0.75, sw / 950), 0.68);
    cloud(sw * 0.7, sh * 0.9, Math.max(0.9, sw / 850), 0.62);

    var horizon = sceneCtx.createLinearGradient(0, sh * 0.88, 0, sh);
    horizon.addColorStop(0, 'rgba(105, 235, 255, 0)');
    horizon.addColorStop(0.5, 'rgba(28, 129, 247, 0.36)');
    horizon.addColorStop(1, 'rgba(1, 8, 43, 0.82)');
    sceneCtx.fillStyle = horizon;
    sceneCtx.fillRect(0, sh * 0.82, sw, sh * 0.18);

    if (imageReady(sceneImage)) {
      var sourceRatio = sceneImage.naturalWidth / sceneImage.naturalHeight;
      var targetRatio = sw / sh;
      var sourceX = 0, sourceY = 0;
      var sourceW = sceneImage.naturalWidth, sourceH = sceneImage.naturalHeight;
      if (targetRatio > sourceRatio) {
        sourceH = sourceW / targetRatio;
        sourceY = (sceneImage.naturalHeight - sourceH) / 2;
      } else {
        sourceW = sourceH * targetRatio;
        sourceX = (sceneImage.naturalWidth - sourceW) / 2;
      }
      sceneCtx.drawImage(
        sceneImage, sourceX, sourceY, sourceW, sourceH, 0, 0, sw, sh
      );
    }
  }

  function buildGameSprites() {
    pipeBodyCanvas = document.createElement('canvas');
    pipeBodyCanvas.width = PIPE_W + 8; pipeBodyCanvas.height = 64;
    var pb = pipeBodyCanvas.getContext('2d');
    var pipeGradient = pb.createLinearGradient(0, 0, pipeBodyCanvas.width, 0);
    pipeGradient.addColorStop(0, '#032f1d');
    pipeGradient.addColorStop(0.13, '#067d27');
    pipeGradient.addColorStop(0.42, '#18c43c');
    pipeGradient.addColorStop(0.58, '#d5f94c');
    pipeGradient.addColorStop(0.69, '#25b936');
    pipeGradient.addColorStop(1, '#01351e');
    pb.fillStyle = pipeGradient;
    pb.fillRect(3, 0, PIPE_W + 2, 64);
    pb.strokeStyle = 'rgba(48, 235, 255, 0.72)';
    pb.lineWidth = 2;
    pb.strokeRect(3, -1, PIPE_W + 2, 66);

    pipeLipCanvas = document.createElement('canvas');
    pipeLipCanvas.width = PIPE_W + 20; pipeLipCanvas.height = LIP + 8;
    var pl = pipeLipCanvas.getContext('2d');
    var lipGradient = pl.createLinearGradient(0, 0, pipeLipCanvas.width, 0);
    lipGradient.addColorStop(0, '#032b1c');
    lipGradient.addColorStop(0.16, '#07852a');
    lipGradient.addColorStop(0.48, '#2ed147');
    lipGradient.addColorStop(0.62, '#e4ff61');
    lipGradient.addColorStop(0.75, '#1aad39');
    lipGradient.addColorStop(1, '#022d1b');
    pl.fillStyle = lipGradient;
    pl.fillRect(2, 2, pipeLipCanvas.width - 4, pipeLipCanvas.height - 4);
    pl.strokeStyle = '#43f1ff';
    pl.lineWidth = 2;
    pl.strokeRect(2, 2, pipeLipCanvas.width - 4, pipeLipCanvas.height - 4);
    pl.strokeStyle = 'rgba(255, 255, 160, 0.55)';
    pl.beginPath();
    pl.moveTo(6, 5); pl.lineTo(pipeLipCanvas.width - 6, 5); pl.stroke();

    birdSprites = [];
    for (var frame = 0; frame < 3; frame++) {
      var sprite = document.createElement('canvas');
      sprite.width = 120; sprite.height = 88;
      var b = sprite.getContext('2d');
      b.shadowColor = 'rgba(45, 208, 255, 0.75)';
      b.shadowBlur = 9;

      b.fillStyle = '#ef8a13';
      b.save(); b.translate(30, 48); b.rotate(-0.42);
      b.beginPath(); b.ellipse(0, -7, 17, 6, 0, 0, Math.PI * 2); b.fill();
      b.beginPath(); b.ellipse(-2, 4, 16, 6, 0, 0, Math.PI * 2); b.fill();
      b.restore();

      var bodyGradient = b.createRadialGradient(58, 30, 4, 54, 43, 30);
      bodyGradient.addColorStop(0, '#fff477');
      bodyGradient.addColorStop(0.34, '#ffd528');
      bodyGradient.addColorStop(0.72, '#f3a20d');
      bodyGradient.addColorStop(1, '#bb5c07');
      b.fillStyle = bodyGradient;
      b.beginPath(); b.ellipse(56, 44, 29, 25, 0, 0, Math.PI * 2); b.fill();

      b.shadowBlur = 0;
      b.fillStyle = '#ffbf19';
      b.beginPath(); b.ellipse(45, 19, 12, 5, -0.75, 0, Math.PI * 2); b.fill();
      b.beginPath(); b.ellipse(57, 17, 12, 5, -0.48, 0, Math.PI * 2); b.fill();

      var wingY = frame === 0 ? 33 : (frame === 1 ? 45 : 55);
      var wingAngle = frame === 0 ? -0.72 : (frame === 1 ? -0.2 : 0.35);
      var wingGradient = b.createLinearGradient(31, wingY - 12, 58, wingY + 12);
      wingGradient.addColorStop(0, '#fff06a');
      wingGradient.addColorStop(0.55, '#f7b416');
      wingGradient.addColorStop(1, '#d57209');
      b.save(); b.translate(38, wingY); b.rotate(wingAngle);
      b.fillStyle = wingGradient;
      b.beginPath(); b.ellipse(0, 0, 19, 9, 0, 0, Math.PI * 2); b.fill();
      b.strokeStyle = 'rgba(138, 69, 3, 0.5)'; b.lineWidth = 1.5; b.stroke();
      b.restore();

      b.fillStyle = '#ffffff';
      b.beginPath(); b.arc(72, 36, 12, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#0a76d9';
      b.beginPath(); b.arc(76, 37, 7, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#06101e';
      b.beginPath(); b.arc(78, 38, 4.3, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#ffffff';
      b.beginPath(); b.arc(79, 35, 1.8, 0, Math.PI * 2); b.fill();

      var beakGradient = b.createLinearGradient(82, 42, 108, 48);
      beakGradient.addColorStop(0, '#ffbb1c');
      beakGradient.addColorStop(0.5, '#ff6d0b');
      beakGradient.addColorStop(1, '#bc3205');
      b.fillStyle = beakGradient;
      b.beginPath();
      b.moveTo(82, 42); b.lineTo(108, 48); b.lineTo(83, 54); b.closePath(); b.fill();
      b.strokeStyle = '#8d2d08'; b.lineWidth = 1.5; b.stroke();

      b.strokeStyle = '#5e3405'; b.lineWidth = 3; b.lineCap = 'round';
      b.beginPath(); b.moveTo(64, 25); b.quadraticCurveTo(72, 20, 80, 24); b.stroke();
      birdSprites.push(sprite);
    }
  }

  function speedFor(sc) { return Math.min(MAX_SPEED, BASE_SPEED + sc * 1.6); }
  function gapFor(sc) {
    var base = Math.max(150, Math.min(190, H * 0.25));
    var tighten = Math.min(34, sc * 0.7);    // gently tightens until ~score 48
    return Math.max(138, base - tighten);
  }
  function birdX() { return Math.max(70, W * 0.28); }

  // ---------- game state ----------
  var S = { READY: 0, PLAY: 1, DEAD: 2 };
  var state = S.READY;
  var bird, pipes, score, best = 0, deadAt = 0, submitted = false;
  var distSinceSpawn, shake, flash;

  function reset() {
    bird = { y: H * 0.45, py: H * 0.45, vy: 0, wing: 0, r: 14 };
    pipes = []; score = 0; submitted = false;
    distSinceSpawn = PIPE_SPACING * 0.55;    // first pipe arrives quickly but fairly
    shake = 0; flash = 0;
    setHud(0);
  }

  var hudEl = document.getElementById('hud');
  function setHud(n) {
    hudEl.textContent = String(n);
    hudEl.classList.remove('pop');
    void hudEl.offsetWidth;                  // restart the pop transition
    hudEl.classList.add('pop');
    setTimeout(function () { hudEl.classList.remove('pop'); }, 130);
  }

  function spawnPipe() {
    var gap = gapFor(score);
    var m = 70;
    var lo = m + gap / 2, hi = H - m - gap / 2;
    var prev = pipes.length ? pipes[pipes.length - 1].cy : H / 2;
    // Bias toward reachable positions: cap the jump from the previous gap.
    var maxJump = H * 0.38;
    var cy = lo + Math.random() * Math.max(1, hi - lo);
    cy = Math.max(prev - maxJump, Math.min(prev + maxJump, cy));
    cy = Math.max(lo, Math.min(hi, cy));
    pipes.push({ x: W + 60, px: W + 60, cy: cy, gap: gap, passed: false });
  }

  function flap() {
    if (state === S.READY) {
      state = S.PLAY;
      document.getElementById('start').classList.add('hidden');
      hudEl.classList.remove('hidden');
    }
    if (state === S.PLAY) bird.vy = FLAP;
    if (state === S.DEAD && performance.now() - deadAt > 700) restart();
  }

  function restart() {
    document.getElementById('over').classList.add('hidden');
    document.getElementById('new-best').classList.remove('show');
    hudEl.classList.remove('hidden');
    reset(); state = S.PLAY; bird.vy = FLAP;
  }

  function die() {
    state = S.DEAD; deadAt = performance.now();
    shake = reducedMotion ? 0 : 1;
    flash = reducedMotion ? 0 : 1;
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    hudEl.classList.add('hidden');
    var isNewBest = score > best && score > 0;
    if (isNewBest) best = score;
    document.getElementById('final-score').textContent = String(score);
    document.getElementById('best-score').textContent = String(best);
    document.getElementById('new-best').classList.toggle('show', isNewBest);
    document.getElementById('over').classList.remove('hidden');
    submitAndLoadRecords();
  }

  // ---------- simulation (fixed step) ----------
  function step(dt) {
    if (state === S.READY) { bird.py = bird.y; bird.y = H * 0.45 + Math.sin(performance.now() / 350) * 8; return; }
    // decay effects even when dead so the crash settles smoothly
    shake = Math.max(0, shake - dt * 3.2);
    flash = Math.max(0, flash - dt * 4.5);
    if (state !== S.PLAY) return;

    bird.py = bird.y;
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.wing += dt * 14;

    var v = speedFor(score);
    distSinceSpawn += v * dt;
    if (distSinceSpawn >= PIPE_SPACING) { distSinceSpawn -= PIPE_SPACING; spawnPipe(); }

    var bx = birdX();
    for (var j = pipes.length - 1; j >= 0; j--) {
      var p = pipes[j];
      p.px = p.x;
      p.x -= v * dt;
      if (!p.passed && p.x + PIPE_W / 2 < bx - bird.r) {
        p.passed = true; score++; setHud(score);
      }
      if (p.x < -PIPE_W - LIP) pipes.splice(j, 1);
      if (Math.abs(p.x - bx) < PIPE_W / 2 + bird.r) {
        var top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
        if (bird.y - bird.r < top || bird.y + bird.r > bot) { die(); return; }
      }
    }
    if (bird.y + bird.r > H - 4 || bird.y - bird.r < -40) { die(); return; }
  }

  // ---------- render (interpolated between sim steps) ----------
  function render(alpha) {
    ctx.drawImage(sceneCanvas, 0, 0, W, H);

    var sx = 0, sy = 0;
    if (shake > 0) {
      var m = shake * 7;
      sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
    }
    ctx.save();
    ctx.translate(sx, sy);

    // luminous horizon/ground line
    ctx.strokeStyle = 'rgba(86, 226, 255, 0.74)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, H - 3); ctx.lineTo(W + 10, H - 3); ctx.stroke();

    // Generated glossy pipe assets; cached Canvas artwork remains offline fallback.
    for (var j = 0; j < pipes.length; j++) {
      var p = pipes[j];
      var x = p.px + (p.x - p.px) * alpha;
      var top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
      if (imageReady(pipeBodyImage) && imageReady(pipeCapImage)) {
        var generatedBodyW = PIPE_W + 4;
        var capW = generatedBodyW * 1.18;
        var capH = capW * pipeCapImage.naturalHeight / pipeCapImage.naturalWidth;
        var topBodyH = Math.max(1, top - capH * 0.56 + 10);
        var bottomBodyY = bot + capH * 0.56;
        ctx.drawImage(
          pipeBodyImage, x - generatedBodyW / 2, -10, generatedBodyW, topBodyH
        );
        ctx.save();
        ctx.translate(x, top);
        ctx.rotate(Math.PI);
        ctx.drawImage(pipeCapImage, -capW / 2, 0, capW, capH);
        ctx.restore();
        ctx.drawImage(
          pipeBodyImage,
          x - generatedBodyW / 2,
          bottomBodyY,
          generatedBodyW,
          Math.max(1, H - bottomBodyY + 10)
        );
        ctx.drawImage(pipeCapImage, x - capW / 2, bot, capW, capH);
      } else {
        var bodyW = pipeBodyCanvas.width;
        var lipW = pipeLipCanvas.width;
        var fallbackTopBodyH = Math.max(1, top - LIP + 10);
        var fallbackBottomBodyH = Math.max(1, H - bot - LIP - 3);
        ctx.drawImage(pipeBodyCanvas, x - bodyW / 2, -10, bodyW, fallbackTopBodyH);
        ctx.drawImage(pipeLipCanvas, x - lipW / 2, top - LIP - 4);
        ctx.drawImage(pipeLipCanvas, x - lipW / 2, bot - 4);
        ctx.drawImage(
          pipeBodyCanvas,
          x - bodyW / 2,
          bot + LIP,
          bodyW,
          fallbackBottomBodyH
        );
      }
    }

    // Generated golden bird — three normalized wing poses from the icon reference.
    var bx = birdX();
    var by = bird.py + (bird.y - bird.py) * alpha;
    ctx.save();
    ctx.translate(bx, by);
    var tilt = Math.max(-0.5, Math.min(0.9, (bird.vy || 0) / 900));
    ctx.rotate(state === S.READY ? 0 : tilt);
    var wingWave = Math.sin(bird.wing);
    var spriteIndex = wingWave > 0.35 ? 0 : (wingWave < -0.35 ? 2 : 1);
    if (imageReady(birdImages[spriteIndex])) {
      ctx.drawImage(birdImages[spriteIndex], -35, -31, 70, 63);
    } else {
      ctx.drawImage(birdSprites[spriteIndex], -34, -27, 68, 50);
    }
    ctx.restore();

    ctx.restore();

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = COL.fg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- main loop: fixed-timestep sim + interpolated render ----------
  var acc = 0, tPrev = 0, slowFrameCount = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!tPrev) { tPrev = t; return; }

    var rawFrame = (t - tPrev) / 1000;
    tPrev = t;

    // A capable device that sustains less than ~26 FPS automatically falls
    // back to the low-power resolution/effects budget after a short sample.
    if (!lowPowerMode) {
      if (rawFrame > 1 / 26 && rawFrame < 0.25) slowFrameCount++;
      else slowFrameCount = Math.max(0, slowFrameCount - 2);
      if (slowFrameCount >= 20) enableLowPowerMode();
    }

    // Never fast-forward through a long OS/browser stall. Ordinary low frame
    // rates still receive enough catch-up steps to keep real-time pacing.
    var frame = rawFrame > 0.25 ? FIXED_DT : Math.min(rawFrame, 0.1);
    acc += frame;
    var steps = 0;
    while (acc >= FIXED_DT && steps < MAX_CATCH_UP_STEPS) {
      step(FIXED_DT); acc -= FIXED_DT; steps++;
    }
    if (steps === MAX_CATCH_UP_STEPS && acc >= FIXED_DT) acc = 0;
    render(Math.min(1, acc / FIXED_DT));
  }
  document.addEventListener('visibilitychange', function () {
    tPrev = 0; acc = 0;
  });

  // ---------- input ----------
  document.addEventListener('pointerdown', function (e) {
    // Never treat taps on the game-over card (toggle, Play again, records
    // list) as a flap — those have their own handlers and must not restart.
    if (e.target.closest && e.target.closest('.panel')) return;
    e.preventDefault(); flap();
  }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });
  document.getElementById('again').addEventListener('click', function () { restart(); });

  // ---------- leaderboard ----------
  var sdkReady = false;
  var currentTab = 'friends';   // 'friends' | 'global'

  function submitAndLoadRecords() {
    // Default back to the Friends tab each game over.
    currentTab = 'friends';
    setTab('friends');
    var recEl = document.getElementById('records');
    recEl.innerHTML = '<div class="empty">' + L.loading + '</div>';
    if (!sdkReady || !window.Usion || !Usion.leaderboard) {
      recEl.innerHTML = '<div class="empty">' + L.empty + '</div>';
      return;
    }
    var submitP = Promise.resolve();
    if (!submitted && score > 0) {
      submitted = true;
      submitP = Usion.leaderboard.submit(score).then(function (r) {
        if (r && typeof r.best === 'number') {
          best = Math.max(best, r.best);
          document.getElementById('best-score').textContent = String(best);
        }
      }).catch(function () {});
    }
    submitP.then(function () { loadTab(currentTab); });
  }

  function setTab(tab) {
    document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
    document.getElementById('tab-friends').setAttribute('aria-selected', tab === 'friends');
    document.getElementById('tab-global').classList.toggle('active', tab === 'global');
    document.getElementById('tab-global').setAttribute('aria-selected', tab === 'global');
  }

  function loadTab(tab) {
    currentTab = tab;
    setTab(tab);
    var recEl = document.getElementById('records');
    if (!sdkReady || !window.Usion || !Usion.leaderboard) {
      recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      return;
    }
    recEl.innerHTML = '<div class="empty">' + L.loading + '</div>';
    var p = tab === 'global'
      ? Usion.leaderboard.top({ limit: 10 })
      : Usion.leaderboard.friends({ limit: 20 });
    p.then(function (entries) {
      // Ignore a stale response if the user switched tabs mid-flight.
      if (currentTab === tab) renderRecords(entries || [], tab);
    }).catch(function () {
      if (currentTab === tab) {
        recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      }
    });
  }

  document.getElementById('tab-friends').addEventListener('click', function () { loadTab('friends'); });
  document.getElementById('tab-global').addEventListener('click', function () { loadTab('global'); });

  function renderRecords(entries, tab) {
    var recEl = document.getElementById('records');
    if (!entries.length) {
      recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      return;
    }
    recEl.innerHTML = '';
    entries.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'rec' + (e.is_me ? ' me' : '');
      var rank = document.createElement('div'); rank.className = 'rank';
      rank.textContent = String(e.rank);
      var av;
      if (e.avatar) { av = document.createElement('img'); av.src = e.avatar; av.alt = ''; }
      else { av = document.createElement('div'); av.className = 'ph'; av.textContent = (e.name || '?').charAt(0).toUpperCase(); }
      var nm = document.createElement('div'); nm.className = 'nm';
      nm.textContent = e.is_me ? L.you : (e.name || 'Player');
      var sc = document.createElement('div'); sc.className = 'sc';
      sc.textContent = String(e.score);
      row.appendChild(rank); row.appendChild(av); row.appendChild(nm); row.appendChild(sc);
      recEl.appendChild(row);
    });
  }

  // ---------- boot ----------
  buildGameSprites();
  reset();
  requestAnimationFrame(loop);

  function boot(config) {
    sdkReady = true;
    applyTheme((config && config.theme) || (window.Usion && Usion.getTheme && Usion.getTheme()) || 'light');
    var lang = (config && config.language) || (Usion.getLanguage && Usion.getLanguage()) || 'en';
    L = STR[lang] || STR.en;
    applyStrings();
    if (Usion.leaderboard && Usion.leaderboard.me) {
      Usion.leaderboard.me().then(function (r) {
        if (r && typeof r.score === 'number') best = Math.max(best, r.score);
      }).catch(function () {});
    }
    if (Usion.claimBackButton) {
      Usion.claimBackButton(function () {
        if (state === S.PLAY) { die(); return true; }
        return false;
      });
    }
  }

  if (window.Usion && typeof Usion.init === 'function') {
    Usion.init(boot);
  } else {
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
    applyStrings();
  }
})();
</script>
</body>
</html>
