<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy</title>
<script src="https://usions.com/usion-sdk.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #000000; --muted: #666666; --line: #e5e5e5;
    --panel: #ffffff; --accent: #0070f3;
  }
  .dark {
    --bg: #000000; --fg: #ffffff; --muted: #999999; --line: #222222;
    --panel: #0a0a0a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    opacity: 1; transition: opacity 160ms ease;
  }
  .overlay.hidden { display: none; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .hint { font-size: 15px; color: var(--muted); text-align: center; }
  .panel {
    width: min(340px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    animation: rise 220ms cubic-bezier(0.21, 1.02, 0.73, 1);
  }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .score-row { display: flex; justify-content: space-around; text-align: center; }
  .score-row .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-row .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
  #new-best {
    display: none; text-align: center; font-size: 13px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.4px;
  }
  #new-best.show { display: block; animation: rise 260ms ease; }
  .btn {
    appearance: none; border: none; cursor: pointer; width: 100%;
    background: var(--fg); color: var(--bg); font-size: 16px; font-weight: 600;
    padding: 14px; border-radius: 10px; min-height: 48px;
  }
  .btn:active { opacity: 0.8; }
  .records { display: flex; flex-direction: column; max-height: 30vh; overflow-y: auto; }
  .seg {
    display: flex; gap: 4px; margin-bottom: 8px; padding: 3px; border-radius: 10px;
    background: color-mix(in srgb, var(--fg) 6%, transparent);
  }
  .seg-btn {
    flex: 1; appearance: none; border: none; cursor: pointer; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 600; padding: 7px 4px;
    border-radius: 8px; min-height: 34px;
  }
  .seg-btn.active { background: var(--panel); color: var(--fg); }
  .rec {
    display: flex; align-items: center; gap: 10px; padding: 8px 2px;
    border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .rec:last-child { border-bottom: none; }
  .rec .rank { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rec img, .rec .ph {
    width: 28px; height: 28px; border-radius: 50%; background: var(--line);
    flex-shrink: 0; object-fit: cover; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: var(--muted);
  }
  .rec .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec.me .nm { font-weight: 700; }
  .rec.me .rank { color: var(--accent); }
  .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 10px 0; }
  #hud {
    position: absolute; top: max(18px, env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: 44px; font-weight: 700; pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 var(--bg);
    transition: transform 120ms ease; will-change: transform;
  }
  #hud.pop { transform: scale(1.18); }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">0</div>

<div id="start" class="overlay">
  <h1 id="t-title">Flappy</h1>
  <p class="hint" id="t-tap">Tap to flap. Don't hit the pipes.</p>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <div class="score-row">
      <div><div class="num" id="final-score">0</div><div class="lbl" id="t-score">Score</div></div>
      <div><div class="num" id="best-score">0</div><div class="lbl" id="t-best">Best</div></div>
    </div>
    <div id="new-best">New record!</div>
    <div>
      <div class="seg" role="tablist">
        <button class="seg-btn active" id="tab-friends" role="tab" aria-selected="true">Friends</button>
        <button class="seg-btn" id="tab-global" role="tab" aria-selected="false">Global</button>
      </div>
      <div class="records" id="records"><div class="empty" id="t-loading">Loading…</div></div>
    </div>
    <button class="btn" id="again">Play again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- i18n ----------
  var STR = {
    en: { title: 'Flappy', tap: "Tap to flap. Don't hit the pipes.", score: 'Score', best: 'Best',
          friends: 'Friends', global: 'Global', loading: 'Loading…', again: 'Play again',
          empty: 'No friend records yet — invite friends and beat their scores!',
          emptyGlobal: 'No scores yet — be the first on the board!', you: 'You',
          newBest: 'New record!' },
    mn: { title: 'Flappy', tap: 'Товшиж нис. Хоолойд бүү мөргө.', score: 'Оноо', best: 'Дээд',
          friends: 'Найзууд', global: 'Дэлхий', loading: 'Уншиж байна…', again: 'Дахин тоглох',
          empty: 'Найзын амжилт алга — найзаа урьж, амжилтыг нь давaарай!',
          emptyGlobal: 'Оноо алга — тэргүүн нь болоорой!', you: 'Та',
          newBest: 'Шинэ дээд амжилт!' }
  };
  var L = STR.en;

  function applyStrings() {
    document.getElementById('t-title').textContent = L.title;
    document.getElementById('t-tap').textContent = L.tap;
    document.getElementById('t-score').textContent = L.score;
    document.getElementById('t-best').textContent = L.best;
    document.getElementById('tab-friends').textContent = L.friends;
    document.getElementById('tab-global').textContent = L.global;
    document.getElementById('again').textContent = L.again;
    document.getElementById('new-best').textContent = L.newBest;
  }

  // ---------- canvas (opaque + desynchronized for smoother compositing) ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }) ||
            canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- theme ----------
  var dark = false;
  var COL = { bg: '#ffffff', fg: '#000000', line: '#e5e5e5', soft: '#f2f2f2' };
  function applyTheme(t) {
    dark = t === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    document.body.classList.toggle('dark', dark);
    COL = dark
      ? { bg: '#000000', fg: '#ffffff', line: '#2a2a2a', soft: '#141414' }
      : { bg: '#ffffff', fg: '#000000', line: '#e5e5e5', soft: '#f2f2f2' };
  }

  // ---------- tuning ----------
  var GRAVITY = 1900, FLAP = -560;
  var BASE_SPEED = 160, MAX_SPEED = 235;     // px/s, ramps with score
  var PIPE_W = 68, LIP = 14;
  var PIPE_SPACING = 250;                    // px between pipe centers (distance-based)
  var FIXED_DT = 1 / 120;                    // simulation step — device-independent

  function speedFor(sc) { return Math.min(MAX_SPEED, BASE_SPEED + sc * 1.6); }
  function gapFor(sc) {
    var base = Math.max(150, Math.min(190, H * 0.25));
    var tighten = Math.min(34, sc * 0.7);    // gently tightens until ~score 48
    return Math.max(138, base - tighten);
  }
  function birdX() { return Math.max(70, W * 0.28); }

  // ---------- game state ----------
  var S = { READY: 0, PLAY: 1, DEAD: 2 };
  var state = S.READY;
  var bird, pipes, clouds, score, best = 0, deadAt = 0, submitted = false;
  var distSinceSpawn, shake, flash;

  function reset() {
    bird = { y: H * 0.45, py: H * 0.45, vy: 0, wing: 0, r: 14 };
    pipes = []; score = 0; submitted = false;
    distSinceSpawn = PIPE_SPACING * 0.55;    // first pipe arrives quickly but fairly
    shake = 0; flash = 0;
    if (!clouds) {
      clouds = [];
      for (var i = 0; i < 5; i++) {
        clouds.push({ x: Math.random() * W, y: 40 + Math.random() * (H * 0.5),
                      r: 14 + Math.random() * 22, v: 0.22 + Math.random() * 0.16 });
      }
    }
    setHud(0);
  }

  var hudEl = document.getElementById('hud');
  function setHud(n) {
    hudEl.textContent = String(n);
    hudEl.classList.remove('pop');
    void hudEl.offsetWidth;                  // restart the pop transition
    hudEl.classList.add('pop');
    setTimeout(function () { hudEl.classList.remove('pop'); }, 130);
  }

  function spawnPipe() {
    var gap = gapFor(score);
    var m = 70;
    var lo = m + gap / 2, hi = H - m - gap / 2;
    var prev = pipes.length ? pipes[pipes.length - 1].cy : H / 2;
    // Bias toward reachable positions: cap the jump from the previous gap.
    var maxJump = H * 0.38;
    var cy = lo + Math.random() * Math.max(1, hi - lo);
    cy = Math.max(prev - maxJump, Math.min(prev + maxJump, cy));
    cy = Math.max(lo, Math.min(hi, cy));
    pipes.push({ x: W + 60, px: W + 60, cy: cy, gap: gap, passed: false });
  }

  function flap() {
    if (state === S.READY) {
      state = S.PLAY;
      document.getElementById('start').classList.add('hidden');
      hudEl.classList.remove('hidden');
    }
    if (state === S.PLAY) bird.vy = FLAP;
    if (state === S.DEAD && performance.now() - deadAt > 700) restart();
  }

  function restart() {
    document.getElementById('over').classList.add('hidden');
    document.getElementById('new-best').classList.remove('show');
    hudEl.classList.remove('hidden');
    reset(); state = S.PLAY; bird.vy = FLAP;
  }

  function die() {
    state = S.DEAD; deadAt = performance.now();
    shake = 1; flash = 1;
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    hudEl.classList.add('hidden');
    var isNewBest = score > best && score > 0;
    if (isNewBest) best = score;
    document.getElementById('final-score').textContent = String(score);
    document.getElementById('best-score').textContent = String(best);
    document.getElementById('new-best').classList.toggle('show', isNewBest);
    document.getElementById('over').classList.remove('hidden');
    submitAndLoadRecords();
  }

  // ---------- simulation (fixed step) ----------
  function step(dt) {
    if (state === S.READY) { bird.py = bird.y; bird.y = H * 0.45 + Math.sin(performance.now() / 350) * 8; return; }
    // decay effects even when dead so the crash settles smoothly
    shake = Math.max(0, shake - dt * 3.2);
    flash = Math.max(0, flash - dt * 4.5);
    if (state !== S.PLAY) return;

    bird.py = bird.y;
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.wing += dt * 14;

    var v = speedFor(score);
    distSinceSpawn += v * dt;
    if (distSinceSpawn >= PIPE_SPACING) { distSinceSpawn -= PIPE_SPACING; spawnPipe(); }

    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= v * c.v * dt;
      if (c.x < -c.r * 3) { c.x = W + c.r * 3; c.y = 40 + Math.random() * (H * 0.5); }
    }

    var bx = birdX();
    for (var j = pipes.length - 1; j >= 0; j--) {
      var p = pipes[j];
      p.px = p.x;
      p.x -= v * dt;
      if (!p.passed && p.x + PIPE_W / 2 < bx - bird.r) {
        p.passed = true; score++; setHud(score);
      }
      if (p.x < -PIPE_W - LIP) pipes.splice(j, 1);
      if (Math.abs(p.x - bx) < PIPE_W / 2 + bird.r) {
        var top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
        if (bird.y - bird.r < top || bird.y + bird.r > bot) { die(); return; }
      }
    }
    if (bird.y + bird.r > H - 4 || bird.y - bird.r < -40) { die(); return; }
  }

  // ---------- render (interpolated between sim steps) ----------
  function render(alpha) {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    var sx = 0, sy = 0;
    if (shake > 0) {
      var m = shake * 7;
      sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
    }
    ctx.save();
    ctx.translate(sx, sy);

    // parallax clouds — barely-there depth
    ctx.fillStyle = COL.soft;
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.arc(c.x + c.r * 0.9, c.y + c.r * 0.25, c.r * 0.72, 0, Math.PI * 2);
      ctx.fill();
    }

    // ground line
    ctx.strokeStyle = COL.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, H - 3); ctx.lineTo(W + 10, H - 3); ctx.stroke();

    // pipes
    ctx.fillStyle = COL.fg;
    for (var j = 0; j < pipes.length; j++) {
      var p = pipes[j];
      var x = p.px + (p.x - p.px) * alpha;
      var top = p.cy - p.gap / 2, bot = p.cy + p.gap / 2;
      ctx.fillRect(x - PIPE_W / 2, -10, PIPE_W, top + 10 - LIP);
      ctx.fillRect(x - PIPE_W / 2 - 6, top - LIP, PIPE_W + 12, LIP);
      ctx.fillRect(x - PIPE_W / 2 - 6, bot, PIPE_W + 12, LIP);
      ctx.fillRect(x - PIPE_W / 2, bot + LIP, PIPE_W, H - bot - LIP - 3);
    }

    // bird
    var bx = birdX();
    var by = bird.py + (bird.y - bird.py) * alpha;
    ctx.save();
    ctx.translate(bx, by);
    var tilt = Math.max(-0.5, Math.min(0.9, (bird.vy || 0) / 900));
    ctx.rotate(state === S.READY ? 0 : tilt);
    ctx.fillStyle = '#0070f3';
    ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.bg;
    var w = Math.sin(bird.wing) * 4;
    ctx.beginPath(); ctx.ellipse(-4, 2 + w, 7, 4.5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -4, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();

    if (flash > 0) {
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = COL.fg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- main loop: fixed-timestep sim + interpolated render ----------
  var acc = 0, tPrev = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!tPrev) { tPrev = t; return; }
    var frame = (t - tPrev) / 1000;
    tPrev = t;
    if (frame > 0.25) frame = FIXED_DT;      // tab was hidden — don't fast-forward
    acc += frame;
    var steps = 0;
    while (acc >= FIXED_DT && steps < 8) { step(FIXED_DT); acc -= FIXED_DT; steps++; }
    if (steps === 8) acc = 0;                // device too slow to catch up — drop time
    render(acc / FIXED_DT);
  }
  document.addEventListener('visibilitychange', function () { tPrev = 0; });

  // ---------- input ----------
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.btn')) return;
    e.preventDefault(); flap();
  }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });
  document.getElementById('again').addEventListener('click', function () { restart(); });

  // ---------- leaderboard ----------
  var sdkReady = false;
  var currentTab = 'friends';   // 'friends' | 'global'

  function submitAndLoadRecords() {
    // Default back to the Friends tab each game over.
    currentTab = 'friends';
    setTab('friends');
    var recEl = document.getElementById('records');
    recEl.innerHTML = '<div class="empty">' + L.loading + '</div>';
    if (!sdkReady || !window.Usion || !Usion.leaderboard) {
      recEl.innerHTML = '<div class="empty">' + L.empty + '</div>';
      return;
    }
    var submitP = Promise.resolve();
    if (!submitted && score > 0) {
      submitted = true;
      submitP = Usion.leaderboard.submit(score).then(function (r) {
        if (r && typeof r.best === 'number') {
          best = Math.max(best, r.best);
          document.getElementById('best-score').textContent = String(best);
        }
      }).catch(function () {});
    }
    submitP.then(function () { loadTab(currentTab); });
  }

  function setTab(tab) {
    document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
    document.getElementById('tab-friends').setAttribute('aria-selected', tab === 'friends');
    document.getElementById('tab-global').classList.toggle('active', tab === 'global');
    document.getElementById('tab-global').setAttribute('aria-selected', tab === 'global');
  }

  function loadTab(tab) {
    currentTab = tab;
    setTab(tab);
    var recEl = document.getElementById('records');
    if (!sdkReady || !window.Usion || !Usion.leaderboard) {
      recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      return;
    }
    recEl.innerHTML = '<div class="empty">' + L.loading + '</div>';
    var p = tab === 'global'
      ? Usion.leaderboard.top({ limit: 10 })
      : Usion.leaderboard.friends({ limit: 20 });
    p.then(function (entries) {
      // Ignore a stale response if the user switched tabs mid-flight.
      if (currentTab === tab) renderRecords(entries || [], tab);
    }).catch(function () {
      if (currentTab === tab) {
        recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      }
    });
  }

  document.getElementById('tab-friends').addEventListener('click', function () { loadTab('friends'); });
  document.getElementById('tab-global').addEventListener('click', function () { loadTab('global'); });

  function renderRecords(entries, tab) {
    var recEl = document.getElementById('records');
    if (!entries.length) {
      recEl.innerHTML = '<div class="empty">' + (tab === 'global' ? L.emptyGlobal : L.empty) + '</div>';
      return;
    }
    recEl.innerHTML = '';
    entries.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'rec' + (e.is_me ? ' me' : '');
      var rank = document.createElement('div'); rank.className = 'rank';
      rank.textContent = String(e.rank);
      var av;
      if (e.avatar) { av = document.createElement('img'); av.src = e.avatar; av.alt = ''; }
      else { av = document.createElement('div'); av.className = 'ph'; av.textContent = (e.name || '?').charAt(0).toUpperCase(); }
      var nm = document.createElement('div'); nm.className = 'nm';
      nm.textContent = e.is_me ? L.you : (e.name || 'Player');
      var sc = document.createElement('div'); sc.className = 'sc';
      sc.textContent = String(e.score);
      row.appendChild(rank); row.appendChild(av); row.appendChild(nm); row.appendChild(sc);
      recEl.appendChild(row);
    });
  }

  // ---------- boot ----------
  reset();
  requestAnimationFrame(loop);

  function boot(config) {
    sdkReady = true;
    applyTheme((config && config.theme) || (window.Usion && Usion.getTheme && Usion.getTheme()) || 'light');
    var lang = (config && config.language) || (Usion.getLanguage && Usion.getLanguage()) || 'en';
    L = STR[lang] || STR.en;
    applyStrings();
    if (Usion.leaderboard && Usion.leaderboard.me) {
      Usion.leaderboard.me().then(function (r) {
        if (r && typeof r.score === 'number') best = Math.max(best, r.score);
      }).catch(function () {});
    }
    if (Usion.claimBackButton) {
      Usion.claimBackButton(function () {
        if (state === S.PLAY) { die(); return true; }
        return false;
      });
    }
  }

  if (window.Usion && typeof Usion.init === 'function') {
    Usion.init(boot);
  } else {
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
    applyStrings();
  }
})();
</script>
</body>
</html>
